openapi: 3.0.3
info:
  description: This is the PingData Configuration API for the Log Publisher Message Exclusion Policy config object
  title: PingData Log Publisher Message Exclusion Policy Config - OpenAPI 3.0
  version: "0.1"
externalDocs:
  description: PingDirectory Configuration API Docs
  url: https://docs.pingidentity.com/r/en-us/pingdirectory-101/pd_ds_use_config_api
tags:
- description: Access log-publisher-message-exclusion-policies
  name: log-publisher-message-exclusion-policy
paths:
  /log-publisher-message-exclusion-policies:
    get:
      summary: Returns a list of all Log Publisher Message Exclusion Policy objects
      operationId: list-log-publisher-message-exclusion-policies
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: SCIM filter
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log-publisher-message-exclusion-policyListResponse'
        "401":
          description: Requestor cannot be authenticated
        "403":
          description: Requestor does not have the required privileges
        "400":
          description: Bad request
      security:
      - basicAuth: []
      tags:
      - log-publisher-message-exclusion-policy
    post:
      summary: Add a new Log Publisher Message Exclusion Policy to the config
      operationId: add-log-publisher-message-exclusion-policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add-error-log-publisher-message-exclusion-policy-request'
        description: Create a new Log Publisher Message Exclusion Policy in the config
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-log-publisher-message-exclusion-policy-response'
        "401":
          description: Requestor cannot be authenticated
        "403":
          description: Requestor does not have the required privileges
        "400":
          description: Bad request
        "409":
          description: The Log Publisher Message Exclusion Policy already exists
      security:
      - basicAuth: []
      tags:
      - log-publisher-message-exclusion-policy
  /log-publisher-message-exclusion-policies/{log-publisher-message-exclusion-policy-name}:
    delete:
      summary: Delete a Log Publisher Message Exclusion Policy
      operationId: delete-log-publisher-message-exclusion-policy
      parameters:
      - description: Name of the Log Publisher Message Exclusion Policy
        explode: false
        in: path
        name: log-publisher-message-exclusion-policy-name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Successful operation
        "401":
          description: Requestor cannot be authenticated
        "403":
          description: Requestor does not have the required privileges
        "404":
          description: The Log Publisher Message Exclusion Policy does not exist
        "409":
          description: The Log Publisher Message Exclusion Policy cannot be deleted
      security:
      - basicAuth: []
      tags:
      - log-publisher-message-exclusion-policy
    get:
      summary: Returns a single Log Publisher Message Exclusion Policy
      operationId: get-log-publisher-message-exclusion-policy
      parameters:
      - description: Name of the Log Publisher Message Exclusion Policy
        explode: false
        in: path
        name: log-publisher-message-exclusion-policy-name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-log-publisher-message-exclusion-policy-response'
        "401":
          description: Requestor cannot be authenticated
        "403":
          description: Requestor does not have the required privileges
        "404":
          description: The Log Publisher Message Exclusion Policy does not exist
      security:
      - basicAuth: []
      tags:
      - log-publisher-message-exclusion-policy
    patch:
      summary: Update an existing Log Publisher Message Exclusion Policy by name
      operationId: update-log-publisher-message-exclusion-policy
      parameters:
      - description: Name of the Log Publisher Message Exclusion Policy
        explode: false
        in: path
        name: log-publisher-message-exclusion-policy-name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateRequest'
        description: Update an existing Log Publisher Message Exclusion Policy
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-log-publisher-message-exclusion-policy-response'
        "401":
          description: Requestor cannot be authenticated
        "403":
          description: Requestor does not have the required privileges
        "400":
          description: Invalid request
        "404":
          description: The Log Publisher Message Exclusion Policy does not exist
      security:
      - basicAuth: []
      tags:
      - log-publisher-message-exclusion-policy
components:
  schemas:
    Enumlog-publisher-message-exclusion-policy-logMessageCategoryProp:
      type: string
      enum:
      - "CORE"
      - "EXTENSIONS"
      - "PROTOCOL"
      - "CONFIG"
      - "LOG"
      - "UTIL"
      - "SCHEMA"
      - "PLUGIN"
      - "JEB"
      - "BACKEND"
      - "TOOLS"
      - "TASK"
      - "ACCESS_CONTROL"
      - "ADMIN"
      - "REPLICATION"
      - "VERSION"
      - "QUICKSETUP"
      - "ADMIN_TOOL"
      - "DSCONFIG"
      - "USER_DEFINED"
      - "EXAMINER"
      - "SYNC"
      - "PROXY"
      - "UPDATE"
      - "CONSOLE"
      - "CONSOLE_TOOLS"
      - "COMMON"
      - "METRIC"
      - "ID_SERVER"
      - "MONITORING"
      - "AUTHORIZATION"
      - "THIRD_PARTY"
      - "COMPONENTS"
      - "RUNTIME_INFORMATION"
      description: >-
          The category of message the Error Log Publisher Message Exclusion Policy will check to exclude.
    Enumlog-publisher-message-exclusion-policy-logMessageSeverityProp:
      type: string
      enum:
      - "FATAL_ERROR"
      - "INFORMATION"
      - "MILD_ERROR"
      - "MILD_WARNING"
      - "NOTICE"
      - "SEVERE_ERROR"
      - "SEVERE_WARNING"
      - "DEBUG"
      description: >-
          The severity level of the log message we want to exclude.
    add-error-log-publisher-message-exclusion-policy-request:
      allOf:
      - type: object
        properties:
          policyName:
            type: string
            description: >-
                Name of the new Log Publisher Message Exclusion Policy
      - $ref: '#/components/schemas/error-log-publisher-message-exclusion-policy-shared'
      required:
      - policyName
    error-log-publisher-message-exclusion-policy-response:
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: >-
                Name of the Log Publisher Message Exclusion Policy
      - $ref: '#/components/schemas/error-log-publisher-message-exclusion-policy-shared'
      - $ref: '#/components/schemas/meta'
      required:
      - id
    error-log-publisher-message-exclusion-policy-shared:
      type: object
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/Enumerror-log-publisher-message-exclusion-policySchemaUrn'
        logMessageCategory:
          $ref: '#/components/schemas/Enumlog-publisher-message-exclusion-policy-logMessageCategoryProp'
        logMessageSeverity:
          $ref: '#/components/schemas/Enumlog-publisher-message-exclusion-policy-logMessageSeverityProp'
        logMessageID:
          type: integer
          description: >-
              Indicates the message id the Error Log Publisher Message Exclusion Policy will check to exclude.
        logMessageRegex:
          type: string
          description: >-
              The message regex the Error Log Publisher Message Exclusion Policy will check to exclude.
        description:
          type: string
          description: >-
              A description for this Log Publisher Message Exclusion Policy
        enabled:
          type: boolean
          description: >-
              Indicates whether the Log Publisher Message Exclusion Policy is enabled for use.
      required:
      - schemas
      - logMessageCategory
      - logMessageSeverity
      - logMessageRegex
      - enabled
    Enumerror-log-publisher-message-exclusion-policySchemaUrn:
      type: string
      enum:
      - "urn:pingidentity:schemas:configuration:2.0:log-publisher-message-exclusion-policy:error"
    log-publisher-message-exclusion-policyListResponse:
      type: object
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
        totalResults:
          type: number
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/error-log-publisher-message-exclusion-policy-response'
    updateRequest:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
      required:
      - operations
    Operation:
      type: object
      properties:
        op:
          $ref: '#/components/schemas/EnumOperation'
        path:
          type: string
        value:
          type: string
      required:
      - op
      - path
    EnumOperation:
      type: string
      enum:
      - "add"
      - "remove"
      - "replace"
    meta:
      type: object
      properties:
        meta:
          type: object
          properties:
            resourceType:
              type: string
            location:
              type: string
        "urn:pingidentity:schemas:configuration:messages:2.0":
          type: object
          properties:
            notifications:
              type: array
              items:
                type: string
            requiredActions:
              type: array
              items:
                type: object
                properties:
                  property:
                    type: string
                  type:
                    type: string
                  synopsis:
                    type: string
                required:
                - type
                - synopsis
  securitySchemes:
    basicAuth:
      scheme: Basic
      type: http
